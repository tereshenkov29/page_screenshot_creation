<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Скриншотер</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; line-height: 1.6; }
    textarea { width: 100%; height: 200px; margin-bottom: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    pre { background: #f9f9f9; padding: 10px; border: 1px solid #ccc; }
    .hidden { display: none; }
  </style>
</head>
<body>
<h1>📸 Создание скриншотов</h1>

<textarea id="urls" placeholder="Вставьте по одной ссылке на строку..."></textarea>
<button onclick="startScreenshots()">Создать скриншоты</button>

<div id="status" class="hidden">
  <h2>🔄 Статус выполнения</h2>
  <pre id="log">Ожидание...</pre>
  <div id="download" class="hidden">
    <h3>✅ Скриншоты готовы</h3>
    <a href="https://screenshot-backend.onrender.com/download" target="_blank">📥 Скачать ZIP</a>
  </div>
</div>

<script>
  let intervalId = null;

  function startScreenshots() {
    const urls = document.getElementById('urls').value.trim();
    if (!urls) {
      alert("Пожалуйста, введите хотя бы одну ссылку.");
      return;
    }

    fetch("https://screenshot-backend.onrender.com/", {
      method: "POST",
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: "urls=" + encodeURIComponent(urls)
    }).then(() => {
      document.getElementById('status').classList.remove('hidden');
      intervalId = setInterval(updateStatus, 2000);
    });
  }

  function updateStatus() {
    fetch("https://screenshot-backend.onrender.com/status")
            .then(res => res.text())
            .then(html => {
              // Вытаскиваем логи из страницы (старый формат /status)
              const temp = document.createElement('div');
              temp.innerHTML = html;
              const log = temp.querySelector('#log');
              const done = html.includes("🎉 Задача завершена.");
              document.getElementById('log').textContent = log ? log.textContent : '';

              if (done) {
                clearInterval(intervalId);
                document.getElementById('download').classList.remove('hidden');
              }
            });
  }
</script>
</body>
</html>
